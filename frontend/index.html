<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop Disease Detection AI</title>

  <!-- SEO Meta -->
  <meta name="description" content="AI-powered crop disease detection using leaf images. Smart agriculture solution." />
  <meta name="keywords" content="AI, Crop Disease, Agriculture, Machine Learning, Plant Health" />
  <meta name="author" content="Pankhuri Srivastava" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Open Graph (for sharing) -->
  <meta property="og:title" content="Crop Disease Detection AI" />
  <meta property="og:description" content="Upload leaf images and detect diseases instantly using AI." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/preview.png" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0f2027" />

  <!-- Preloader Style -->
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0f2027;
      color: white;
    }

    #loader {
      position: fixed;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
    }

    .spinner {
      border: 6px solid #fff;
      border-top: 6px solid #00c853;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <!-- 🔄 Loading Screen -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Loading Crop AI...</p>
  </div>

  <!-- ⚛️ React Root -->
  <div id="root"></div>

  <!-- Main Script -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Hide Loader after load -->
  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("loader");
      loader.style.opacity = "0";
      setTimeout(() => loader.style.display = "none", 500);
    });
  </script>

</body>
</html>
